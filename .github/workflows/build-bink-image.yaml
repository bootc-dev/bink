name: Build and Push Bink CLI Image

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'Containerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bink
  # internal/config/defaults.go hardcodes this local build tag regardless of
  # which repository checked it out, so `make build-bink-image` always
  # produces this exact ref, not one derived from IMAGE_NAME above.
  LOCAL_IMAGE: ghcr.io/bootc-dev/bink/bink:latest

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # CGO_ENABLED=1 (gpgme/btrfs/device-mapper) rules out cross-compiling
        # from an amd64 host, so build each architecture on its own native
        # runner instead.
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: bootc-dev/actions/bootc-host-setup@main

      - name: Build bink CLI image
        run: make build-bink-image

      - name: Push by digest
        uses: bootc-dev/actions/build-push-image@main
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          local-image: ${{ env.LOCAL_IMAGE }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}

  manifest:
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: bootc-dev/actions/bootc-host-setup@main

      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          path: digests
          pattern: container-digests-*
          merge-multiple: true

      - name: Assemble and push manifest list
        run: |
          podman login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ${{ env.REGISTRY }}
          podman manifest create localhost/bink:dev
          for arch_file in digests/*; do
            arch=$(basename "$arch_file")
            digest=$(cat "$arch_file")
            podman manifest add --arch "$arch" localhost/bink:dev "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}"
          done
          # v2s2 keeps the per-architecture manifests in the same format as
          # the images published before this became a manifest list, so the
          # only change downstream sees is the added list layer.
          podman manifest push --all --format v2s2 \
            localhost/bink:dev "docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
