name: Setup Bink
description: Configure the runner, build bink, and cache container images

inputs:
  cache-key-prefix:
    description: Prefix for the image cache key
    required: true
  node-image:
    description: Node image to pull (omit if already loaded locally)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Add node image to pull list
      if: inputs.node-image != ''
      shell: bash
      run: echo "BINK_IMAGES=$BINK_IMAGES ${{ inputs.node-image }}" >> "$GITHUB_ENV"

    - name: Configure kernel for nested containers
      shell: bash
      run: |
        sudo systemctl disable --now apparmor 2>/dev/null || true
        sudo aa-teardown 2>/dev/null || true
        echo "AppArmor status after teardown:"
        sudo aa-status 2>/dev/null || echo "(aa-status failed)"
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
        sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

    - name: Enable KSM (Kernel Same-page Merging)
      shell: bash
      run: |
        sudo sh -c 'echo 1 > /sys/kernel/mm/ksm/run'
        sudo sh -c 'echo 5000 > /sys/kernel/mm/ksm/pages_to_scan'
        cat /sys/kernel/mm/ksm/run

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          podman \
          libgpgme-dev \
          libbtrfs-dev \
          libdevmapper-dev \
          pkg-config
        # passt's postinst reloads its AppArmor profile in enforce mode; remove it
        sudo aa-teardown 2>/dev/null || true

    - name: Set up KVM
      shell: bash
      run: |
        sudo chmod 666 /dev/kvm
        ls -la /dev/kvm

    - name: Configure Podman
      shell: bash
      run: |
        podman --version
        mkdir -p ~/.config/containers
        echo '{"defaultAction":"SCMP_ACT_ALLOW"}' > ~/.config/containers/seccomp.json
        printf '[containers]\napparmor_profile = "unconfined"\nseccomp_profile = "%s/.config/containers/seccomp.json"\n' "$HOME" > ~/.config/containers/containers.conf
        USER_NAME=$(id -un)
        grep -q "^${USER_NAME}:" /etc/subuid || echo "${USER_NAME}:100000:65536" | sudo tee -a /etc/subuid
        grep -q "^${USER_NAME}:" /etc/subgid || echo "${USER_NAME}:100000:65536" | sudo tee -a /etc/subgid
        printf 'unqualified-search-registries = ["docker.io"]\n' > ~/.config/containers/registries.conf
        systemctl --user enable --now podman.socket
        echo "CONTAINER_HOST=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_ENV"
        podman info --format '{{.Store.GraphRoot}}'

    - name: Build bink binary
      shell: bash
      run: make build-bink

    - name: Build cluster and DNS images
      shell: bash
      run: |
        make build-cluster-image
        make build-dns-image

    - name: Verify prerequisites
      shell: bash
      run: |
        test -f ./bink
        podman images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
        df -h /
        free -h

    - name: Get image digests
      id: digests
      shell: bash
      run: |
        ALL_DIGESTS=""
        for img in $BINK_IMAGES $EXTERNAL_IMAGES; do
          digest=$(skopeo inspect --no-creds "docker://${img}" --format '{{.Digest}}')
          echo "${img}: ${digest}"
          ALL_DIGESTS="${ALL_DIGESTS}${digest}"
        done
        echo "hash=$(echo -n "${ALL_DIGESTS}" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - name: Restore cached images
      id: image-cache
      uses: actions/cache/restore@v6
      with:
        path: /tmp/podman-image-cache
        key: podman-images-v2-${{ inputs.cache-key-prefix }}-${{ steps.digests.outputs.hash }}

    - name: Load cached images
      if: steps.image-cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for f in /tmp/podman-image-cache/*.tar; do
          podman load -i "$f"
        done
        podman images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

    - name: Pre-pull container images
      if: steps.image-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p /tmp/podman-image-cache
        for img in $BINK_IMAGES $EXTERNAL_IMAGES; do
          podman pull "$img"
          name=$(echo "$img" | sed 's|[/:]|_|g')
          podman save -o "/tmp/podman-image-cache/${name}.tar" "$img"
        done

    - name: Save image cache
      if: steps.image-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: /tmp/podman-image-cache
        key: podman-images-v2-${{ inputs.cache-key-prefix }}-${{ steps.digests.outputs.hash }}
